<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顏晟伍 | 個人數位名片</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === 1. CSS 變數與主題設定 === */
        :root {
            /* 預設為 Light Mode 的卡片色彩 */
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-hover: rgba(0, 0, 0, 0.1);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            
            /* 預設背景漸層 (Chill 模式) */
            --bg-gradient: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #e0c3fc, #8ec5fc);
        }

        /* Dark Mode 設定 */
        body.dark-mode {
            --card-bg: rgba(30, 30, 30, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.2);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* === 2. 基礎重置與排版 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        /* 背景流動動畫 */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 點擊背景切換的提示語 */
        .bg-hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* === 3. 控制面板 (深淺色 / 音樂按鈕) === */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .control-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .control-btn:hover {
            transform: scale(1.1);
            background: var(--btn-hover);
        }

        /* === 4. 名片主體設計 === */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--shadow);
            z-index: 1;
            /* 卡片微浮動動畫 */
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* 大頭照 */
        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.15) rotate(5deg);
        }

        /* 文字資訊 */
        h1 {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        h2 {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* 自我介紹清單 */
        .intro {
            text-align: left;
            margin-bottom: 30px;
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .intro p {
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
        }

        .intro span {
            color: #ff9a9e; /* 點綴色 */
            margin-right: 8px;
            font-size: 1.1rem;
        }

        /* === 5. 社群按鈕 === */
        .social-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .social-btn {
            background: var(--btn-bg);
            color: var(--text-primary);
            text-decoration: none;
            padding: 15px 0;
            border-radius: 16px;
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            color: #fff; /* Hover 時圖示反白或強調 */
        }

        /* 各別按鈕 Hover 顏色 */
        .social-btn.fb:hover { background: #1877F2; }
        .social-btn.ig:hover { background: #E4405F; }
        .social-btn.yt:hover { background: #FF0000; }
        .social-btn.mail:hover { background: #EA4335; }

        /* === 6. RWD 響應式設計 === */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 { font-size: 1.5rem; }
            h2 { font-size: 0.85rem; }
            .intro { font-size: 0.9rem; }
            .social-btn { padding: 12px 0; font-size: 1.1rem; }
            .control-btn { width: 40px; height: 40px; font-size: 1rem; }
        }
    </style>
</head>
<body>

        <button id="theme-toggle" class="control-btn" title="切換深淺色">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button id="music-toggle" class="control-btn" title="播放/暫停音樂">
            <i class="fa-solid fa-volume-xmark"></i>
        </button>
    </div>

    <div class="bg-hint">Click anywhere to change the vibe</div>

    <audio id="bg-audio" loop></audio>

    <script>
        // === Vibe 設定 (漸層色 + 音樂) ===
        // 請將 audioSrc 替換為你喜歡的音樂網址 (如 mp3 連結)
        const vibes = [
            {
                name: "Chill",
                gradient: "linear-gradient(-45deg, #fbc2eb, #a6c1ee, #e0c3fc, #8ec5fc)",
                audioSrc: "https://actions.google.com/sounds/v1/ambient/soft_piano_music.ogg" // 測試用白噪音
            },
            {
                name: "Night",
                gradient: "linear-gradient(-45deg, #141e30, #243b55, #0f2027, #203a43)",
                audioSrc: "https://actions.google.com/sounds/v1/ambient/night_sounds_at_lake.ogg"
            },
            {
                name: "Neon",
                gradient: "linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb)",
                audioSrc: "https://actions.google.com/sounds/v1/ambient/synth_hum.ogg"
            }
        ];

        let currentVibeIndex = 0;
        let isMusicPlaying = false;
        
        const audio = document.getElementById('bg-audio');
        const themeToggle = document.getElementById('theme-toggle');
        const musicToggle = document.getElementById('music-toggle');
        const card = document.getElementById('profile-card');

        // 初始化第一首音樂
        audio.src = vibes[0].audioSrc;
        audio.volume = 0;

        // === 1. 音樂淡入淡出邏輯 ===
        let fadeInterval;
        function crossfadeMusic(newSrc) {
            clearInterval(fadeInterval);
            
            // 淡出
            fadeInterval = setInterval(() => {
                if (audio.volume > 0.1) {
                    audio.volume = Math.max(0, audio.volume - 0.1);
                } else {
                    clearInterval(fadeInterval);
                    audio.volume = 0;
                    audio.src = newSrc;
                    
                    if (isMusicPlaying) {
                        audio.play().then(() => {
                            // 淡入
                            fadeInterval = setInterval(() => {
                                if (audio.volume < 0.9) {
                                    audio.volume = Math.min(1, audio.volume + 0.1);
                                } else {
                                    clearInterval(fadeInterval);
                                    audio.volume = 1;
                                }
                            }, 100);
                        }).catch(e => console.log("瀏覽器阻擋自動播放"));
                    }
                }
            }, 100);
        }

        // === 2. 點擊背景切換 Vibe ===
        document.body.addEventListener('click', (e) => {
            // 避免點擊卡片內部或控制按鈕時觸發背景切換
            if (card.contains(e.target) || e.target.closest('.control-btn')) {
                return;
            }

            // 切換至下一個 Vibe
            currentVibeIndex = (currentVibeIndex + 1) % vibes.length;
            const newVibe = vibes[currentVibeIndex];

            // 更改 CSS 變數中的背景漸層
            document.documentElement.style.setProperty('--bg-gradient', newVibe.gradient);
            
            // 執行音樂過渡
            crossfadeMusic(newVibe.audioSrc);
        });

        // === 3. 音樂靜音/播放切換 ===
        musicToggle.addEventListener('click', () => {
            const icon = musicToggle.querySelector('i');
            
            if (isMusicPlaying) {
                // 暫停
                audio.pause();
                icon.classList.remove('fa-volume-high');
                icon.classList.add('fa-volume-xmark');
                isMusicPlaying = false;
            } else {
                // 播放 (瀏覽器通常要求使用者互動後才能播放，按鈕點擊完美符合條件)
                audio.volume = 1;
                audio.play();
                icon.classList.remove('fa-volume-xmark');
                icon.classList.add('fa-volume-high');
                isMusicPlaying = true;
            }
        });

        // === 4. 深淺色模式切換 ===
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const icon = themeToggle.querySelector('i');
            
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });

    </script>
</body>
</html>
